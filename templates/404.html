{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block header_title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-danger fw-bold mb-3"><i class="fa-solid fa-triangle-exclamation"></i> 404</div>
    <h3 class="fw-bold text-dark">Page Not Found</h3>
    <p class="text-muted">The requested page or record does not exist in the municipal register.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary fw-semibold mt-3">
        <i class="fa-solid fa-house me-2"></i>Return to Dashboard
    </a>
</div>
{% endblock %}
