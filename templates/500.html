{% extends "base.html" %}
{% block title %}Internal Server Error{% endblock %}
{% block header_title %}500 - Server Error{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-warning fw-bold mb-3"><i class="fa-solid fa-bug"></i> 500</div>
    <h3 class="fw-bold text-dark">Internal Server Error</h3>
    <p class="text-muted">An unexpected server condition occurred while processing your request.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary fw-semibold mt-3">
        <i class="fa-solid fa-house me-2"></i>Return to Dashboard
    </a>
</div>
{% endblock %}
